<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Student Expense Tracker</h1>
    <form id="expenseForm">
        <div class="form-row">
            <label for="expenseName">Expense Name:</label>
            <input type="text" id="expenseName" placeholder="Enter your Expense" required>
        </div>
        <div class="form-row">
            <label for="amount">Expense Amount:</label>
            <input type="number" id="amount" placeholder="Enter your Amount" min="0.01" step="0.01" required>
        </div>
        <div class="form-row">
            <label for="categories">Select Category:</label>
            <select name="categories" id="categories">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <button type="submit">Add Expense</button>
    </form>
    <h2>Total Expenses: ₹<span id="total">0</span></h2>
    <h2>Expenses List</h2>
    <select id="filter" onchange="showExpenses()">
        <option value="All">All Categories</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
    </select>
    <ul id="expenseList"></ul>
    <script src="script.js"></script>
</body>
</html>
